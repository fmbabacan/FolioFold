name: Bug report
description: Report a reproducible FolioFold problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove confidential document content before submitting.
  - type: input
    id: version
    attributes:
      label: FolioFold version
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac architecture
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
