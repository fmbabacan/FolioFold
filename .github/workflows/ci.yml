name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify Apache license
        run: grep -q "Apache License" LICENSE
      - name: Verify dependency-free package
        run: swift package show-dependencies --format json | python3 -c 'import json,sys; assert json.load(sys.stdin)["dependencies"] == []'
      - name: Validate String Catalog
        run: python3 -m json.tool Sources/FolioFold/Resources/Localizable.xcstrings >/dev/null
      - name: Verify accessibility and localization coverage
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = '\n'.join(
              path.read_text()
              for path in Path('Sources/FolioFold').rglob('*.swift')
          )
          catalog = json.loads(Path('Sources/FolioFold/Resources/Localizable.xcstrings').read_text())
          keys = set(catalog.get('strings', {}))
          required_catalog_entries = {
              'Create',
              'Open',
              'Merge',
              'Split',
              'Convert',
              'Recents',
              'Export PDF…',
              'Page thumbnails',
              'Password Required',
              'PDF Password Required',
              'Recovery Data Available',
              'Document Changed Outside FolioFold',
          }
          missing = sorted(required_catalog_entries - keys)
          assert not missing, f'Missing String Catalog entries: {missing}'

          required_accessibility_labels = {
              'Workspace tabs',
              'Document content',
              'Page thumbnails',
              'Operation progress',
              'Remove recent document',
          }
          absent = sorted(label for label in required_accessibility_labels if label not in source)
          assert not absent, f'Missing accessibility labels: {absent}'
          PY
      - name: Verify offline-only source tree
        run: |
          ! grep -R -n -E 'URLSession|NWConnection|Network\.|WebKit|WKWebView' Sources --include='*.swift'
      - name: Test
        run: swift test
      - name: Build release
        run: swift build -c release
      - name: Runtime smoke test
        run: |
          chmod +x scripts/runtime-smoke.sh
          scripts/runtime-smoke.sh .build/release/FolioFold
      - name: UI smoke test
        run: |
          chmod +x scripts/ui-smoke.sh
          scripts/ui-smoke.sh .build/release/FolioFold
      - name: Enforce 40 MB executable budget
        run: test $(stat -f%z .build/release/FolioFold) -lt 41943040
      - name: Enforce compressed package budget
        run: |
          ditto -c -k --sequesterRsrc .build/release/FolioFold FolioFold-${{ runner.arch }}.zip
          test $(stat -f%z FolioFold-${{ runner.arch }}.zip) -lt 41943040
      - name: Verify application bundle packaging
        run: |
          chmod +x scripts/package-release.sh scripts/notarize-release.sh
          architecture=$(printf '%s' "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')
          FOLIOFOLD_VERSION=0.2.0 scripts/package-release.sh "${architecture}"
          test -s "dist/FolioFold-0.2.0-${architecture}.zip"
          test -s "dist/FolioFold-0.2.0-${architecture}.zip.sha256"
      - name: Upload release executable
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: FolioFold-${{ runner.arch }}
          path: FolioFold-${{ runner.arch }}.zip

  intel-build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build and test x86_64
        run: |
          swift test
          swift build -c release
          test "$(file .build/release/FolioFold)" != ""
          file .build/release/FolioFold | grep -q x86_64
      - name: Package Intel release
        run: |
          ditto -c -k --sequesterRsrc .build/release/FolioFold FolioFold-x86_64.zip
          test $(stat -f%z FolioFold-x86_64.zip) -lt 41943040
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: FolioFold-x86_64
          path: FolioFold-x86_64.zip
