name: Release verification

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published version tag, for example v0.3.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Download published assets
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG=${EVENT_TAG:-${INPUT_TAG}}
          test -n "${TAG}"
          mkdir -p release-assets
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir release-assets
      - name: Verify required files and checksums
        run: |
          test -n "$(find release-assets -name 'FolioFold-*-arm64.zip' -print -quit)"
          test -n "$(find release-assets -name 'FolioFold-*-x86_64.zip' -print -quit)"
          test -n "$(find release-assets -name 'FolioFold-*-arm64.zip.sha256' -print -quit)"
          test -n "$(find release-assets -name 'FolioFold-*-x86_64.zip.sha256' -print -quit)"
          for checksum in release-assets/*.sha256; do
            (cd release-assets && shasum -a 256 -c "$(basename "${checksum}")")
          done
      - name: Verify signatures, notarization, and architecture
        run: |
          for archive in release-assets/*.zip; do
            work=$(mktemp -d)
            ditto -x -k "${archive}" "${work}"
            app="${work}/FolioFold.app"
            test -d "${app}"
            codesign --verify --deep --strict --verbose=2 "${app}"
            spctl --assess --type execute --verbose=2 "${app}"
            if [[ "${archive}" == *-arm64.zip ]]; then
              file "${app}/Contents/MacOS/FolioFold" | grep -q arm64
            else
              file "${app}/Contents/MacOS/FolioFold" | grep -q x86_64
            fi
            rm -rf "${work}"
          done
